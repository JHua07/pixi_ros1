[workspace]
authors = ["jhua07 <2687483227@qq.com>"]
channels = ["conda-forge", "robostack"]
name = "PIXI_ROS1"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# ============================================================
# 环境激活脚本：source ROS + 工作空间
# ============================================================
activate_ros = { cmd = "echo \"source $(pixi info --manifest-path pixi.toml | grep 'Environment path' | cut -d' ' -f4)/setup.bash && source $(pixi info --manifest-path pixi.toml | grep 'Environment path' | cut -d' ' -f4)/setup.sh && source devel_ws/setup.bash\"", description = "打印 ROS 环境激活命令" }

# ============================================================
# 初始化工作空间
# ============================================================
init_workspace = { cmd = "mkdir -p src", description = "创建 src 目录" }

# ============================================================
# 克隆 & 构建 livox_sdk
# ============================================================
clone_livox_sdk = { cmd = "bash scripts/clone_livox_sdk.sh", description = "克隆 Livox SDK 源码" }

build_livox_sdk = { cmd = "bash scripts/build_livox_sdk.sh", description = "编译安装 Livox SDK", depends-on = ["clone_livox_sdk"] }

# ============================================================
# 克隆 & 构建 livox_ros_driver
# ============================================================
clone_livox_ros_driver = { cmd = "bash scripts/clone_livox_ros_driver.sh", description = "克隆 Livox ROS Driver 源码" }

link_livox_driver = { cmd = "bash scripts/link_livox_driver.sh", description = "软链接 livox_ros_driver 到 catkin 工作空间", depends-on = ["init_workspace", "clone_livox_ros_driver"] }

build_livox_ros_driver = { cmd = "bash scripts/build_livox_ros_driver.sh", description = "编译 livox_ros_driver", depends-on = ["build_livox_sdk", "link_livox_driver"] }

# ============================================================
# 一键构建所有源码依赖
# ============================================================
build_all = { cmd = "echo 'Running: clone_livox_sdk -> build_livox_sdk -> link_livox_driver -> build_livox_ros_driver'", description = "一键构建 livox_sdk + livox_ros_driver", depends-on = ["build_livox_ros_driver"] }

# ============================================================
# 打印环境信息
# ============================================================
info = { cmd = """
    echo '=== ROS 版本 ===' && \
    rosversion -d 2>/dev/null || echo 'ROS not sourced yet' && \
    echo '' && \
    echo '=== OpenCV 版本 ===' && \
    pkg-config --modversion opencv4 2>/dev/null || echo 'checking opencv...' && \
    echo '' && \
    echo '=== Eigen3 版本 ===' && \
    pkg-config --modversion eigen3 2>/dev/null || echo 'checking eigen3...' && \
    echo '' && \
    echo '=== Livox SDK ===' && \
    ls $CONDA_PREFIX/lib/liblivox_sdk* 2>/dev/null || echo 'Livox SDK not built yet' && \
    echo '' && \
    echo '=== 激活环境 ===' && \
    echo '  source $CONDA_PREFIX/setup.bash'
""", description = "显示已安装的包版本信息" }

[dependencies]
# ============================================================
# ROS Noetic Desktop (完整桌面版)
# ============================================================
ros-noetic-desktop = { version = ">=1.5.0", channel = "robostack" }
ros-noetic-catkin = { version = ">=0.8.10", channel = "robostack" }
ros-noetic-pcl-ros = { version = ">=1.7", channel = "robostack" }

# ============================================================
# OpenCV (C++ 库 + Python 绑定)
# ============================================================
libopencv = { version = ">=4.5,<6", channel = "conda-forge" }
opencv = { version = ">=4.5,<6", channel = "conda-forge" }

# ============================================================
# Eigen3
# ============================================================
eigen = { version = ">=3.3,<4", channel = "conda-forge" }

# ============================================================
# 构建工具
# ============================================================
cmake = { version = ">=3.16", channel = "conda-forge" }
make = { version = "*", channel = "conda-forge" }
pkg-config = { version = "*", channel = "conda-forge" }
compilers = { version = "*", channel = "conda-forge" }
